
# general settings
name: DCHiT_S_SIR_x4
model_type: DCHITModel
scale: 4
num_gpu: 1
manual_seed: 1226

datasets:
  test_1:  # the 1st test dataset
    task: SR
    name: RASMD_SR
    type: PairedImageDataset
    dataroot_gt: /home/jyw/im2im/data/RASMD_SR/test/LR/x2
    dataroot_lq: /home/jyw/im2im/data/RASMD_SR/test/LR/x8
    filename_tmpl: '{}'
    io_backend:
      type: disk



# network structures
network_g:
  type: DCHiT_SIR
  upscale: 4
  in_chans: 3
  img_size: 128
  base_win_size: [8,8]
  img_range: 1.
  depths: [4,4,4,4]
  embed_dim: 240
  num_heads: [6,6,6,6]
  expansion_factor: 2
  resi_connection: '1conv'
  hier_win_ratios: [1,2,2,4]
  upsampler: 'pixelshuffledirect'
gamma: "parameter"

# path
path:
  pretrain_network_g: /home/jyw/im2im/HiT-SR/experiments/DCHiT_S_SIR_x4_rasmd/models/net_g_100000.pth
  strict_load_g: True

# validation settings
val:
  save_img: True
  suffix: ~  # add suffix to saved images, if None, use exp name
  use_chop: False  # True to save memory, if img too large

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: True
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: True
