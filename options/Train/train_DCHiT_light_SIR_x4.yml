# general settings
name: DCHiT_light_SIR_x4_m3fd
model_type: DCHITModel
scale: 4
num_gpu: 1
manual_seed: 1226

# dataset and data loader settings
datasets:
  train:
    task: SR
    name: M3FD_SR
    type: PairedImageDataset
    dataroot_gt: /home/jyw/im2im/data/M3FD_SR/train/HR
    dataroot_lq: /home/jyw/im2im/data/M3FD_SR/train/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 512
    use_hflip: False
    use_rot: False

    # data loader
    use_shuffle: True
    num_worker_per_gpu: 16
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    task: SR
    name: M3FD_SR
    type: PairedImageDataset
    dataroot_gt: /home/jyw/im2im/data/M3FD_SR/test/HR
    dataroot_lq: /home/jyw/im2im/data/M3FD_SR/test/x4
    filename_tmpl: '{}'
    io_backend:
      type: disk

# network structures
network_g:
  type: DCHiT_SIR
  upscale: 4
  in_chans: 3
  img_size: 128
  base_win_size: [8,8]
  img_range: 1.
  depths: [4,4,4,4]
  embed_dim: 80
  num_heads: [2,2,2,2]
  expansion_factor: 1
  resi_connection: '1conv'
  hier_win_ratios: [1,1,2,2]
  upsampler: 'pixelshuffledirect'
gamma: "parameter"
# path
path:
  pretrain_network_g: ~
  strict_load_g: False
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 5e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  static_lr_mul: 50
  scheduler:
    type: MultiStepLR
    milestones: [50000, 80000, 90000, 92500]
    gamma: 0.5

  total_iter: 100000
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
    
  # edge_opt:
  #   type: EdgeLoss
  #   loss_weight: 0.2        # Sobel-L1

  # hfen_opt:
  #   type: HFENLoss
  #   loss_weight: 0.1 

# validation settings
val:
  val_freq: !!float 5e3
  save_img: True

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: True
    
    ssim: # metric name, can be arbitrary
      type: calculate_ssim
      crop_border: 4
      test_y_channel: True

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: True
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
